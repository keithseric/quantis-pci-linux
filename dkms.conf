PACKAGE_NAME="quantis-pci"
PACKAGE_VERSION="18.03.08-linux61.2"

BUILT_MODULE_NAME[0]="quantis_pci"
BUILT_MODULE_LOCATION[0]="linux/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/char/"

